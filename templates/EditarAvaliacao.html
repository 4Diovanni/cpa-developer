
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Avaliação - Portal CPA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        h1 {
            color: #173b65;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 13px;
            background: #173b65;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #285783;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #173b65;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Editar avaliação</h1>
        <p>Altere as informações da avaliação abaixo.</p>

        <form method="POST">

            <label for="titulo">Título da avaliação:</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ avaliacao.titulo }}"
                required
            >

            <label for="inicio">Data de início:</label>
            <input
                type="date"
                id="inicio"
                name="inicio"
                value="{{ avaliacao.data_inicio.isoformat() }}"
                required
            >

            <label for="fim">Data de encerramento:</label>
            <input
                type="date"
                id="fim"
                name="fim"
                value="{{ avaliacao.data_fim.isoformat() }}"
                required
            >

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="Agendada"
                    {% if avaliacao.status == "Agendada" %}selected{% endif %}>
                    Agendada
                </option>

                <option value="Em andamento"
                    {% if avaliacao.status == "Em andamento" %}selected{% endif %}>
                    Em andamento
                </option>

                <option value="Encerrada"
                    {% if avaliacao.status == "Encerrada" %}selected{% endif %}>
                    Encerrada
                </option>
            </select>

            <button type="submit">Salvar alterações</button>

        </form>

        <a class="voltar" href="{{ url_for('coordenador') }}">
            ← Voltar à coordenação
        </a>

    </div>
</div>

</body>
</html>
