
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CPA - Editar Usuário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        h1 {
            color: #173b65;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 22px;
            padding: 12px 20px;
            background: #173b65;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #173b65;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <h1>Editar usuário</h1>
            <p>Altere os dados da conta selecionada.</p>

            <form method="POST">
    <input type="hidden" name="tema" value="{{ tema }}">

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ usuario.nome }}"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ usuario.email }}"
                    required
                >

                <label for="perfil">Perfil de acesso</label>
                <select id="perfil" name="perfil" required>
                    <option value="aluno" {% if usuario.perfil == "aluno" %}selected{% endif %}>Aluno</option>
                    <option value="coordenador" {% if usuario.perfil == "coordenador" %}selected{% endif %}>Coordenador</option>
                    <option value="avaliador" {% if usuario.perfil == "avaliador" %}selected{% endif %}>Avaliador</option>
                    <option value="admin" {% if usuario.perfil == "admin" %}selected{% endif %}>Administrador</option>
                </select>

                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Deixe em branco para manter a senha atual"
                >

                <button type="submit">Salvar alterações</button>

            </form>

            <a class="voltar" href="{{ url_for('admin') }}">
                Voltar ao painel administrativo
            </a>

        </div>
    </div>
</body>
</html>
